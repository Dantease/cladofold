name: Deploy website
on:
  push:
    branches: ['main', 'codex/initial-release']
    paths: ['website/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Dantease/cladofold'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - name: Verify preview download availability
        id: release
        shell: bash
        run: |
          if curl --fail --silent --show-error --location --head --retry 2 'https://github.com/Dantease/cladofold/releases/download/v1.3.0-preview/cladofold.-1.3.0-universal-preview.dmg' > /dev/null; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        working-directory: website
        env:
          VITE_RELEASE_READY: ${{ steps.release.outputs.ready }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
