name: Deploy website
on:
  push:
    branches: ['main']
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Dantease/cladofold'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - name: Verify preview download availability
        run: curl --fail --silent --show-error --location --head --retry 2 'https://github.com/Dantease/cladofold/releases/download/v1.4.0-preview/cladofold.-1.4.0-universal-notarized.dmg' > /dev/null
      - name: Verify signed update feed and archive
        run: |
          node --test Tests/Updates/feed.test.mjs
          curl --fail --silent --show-error --location --retry 2 'https://github.com/Dantease/cladofold/releases/download/v1.4.0-preview/cladofold.-1.4.0-universal-notarized.dmg' --output "$RUNNER_TEMP/cladofold.-1.4.0-universal-notarized.dmg"
          ./Scripts/check-update-feed.sh "$RUNNER_TEMP/cladofold.-1.4.0-universal-notarized.dmg"
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
